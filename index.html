<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>桑葚集 · 收藏&quot;能用、好用&quot;的内容</title>
    <meta name="description" content="收藏&quot;能用、好用&quot;的内容,数据公开在 GitHub 仓库。" />
    <meta name="author" content="桑葚" />
    <!-- 默认 OG meta:SPA 首屏 SEO 兜底,JS 挂载后由 <SEO> 覆盖为页面级内容
         (覆盖范围:微信/微博/QQ/知乎/朋友圈/QQ空间;Twitter 顺手放) -->
    <meta property="og:site_name" content="桑葚集" />
    <meta property="og:title" content="桑葚集 · 收藏能用、好用的内容" />
    <meta property="og:description" content="收藏能用、好用的内容,数据公开在 GitHub 仓库。" />
    <meta property="og:image" content="https://mulberrytian.vercel.app/og-default.png" />
    <meta property="og:url" content="https://mulberrytian.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="桑葚集" />
    <meta name="twitter:description" content="收藏能用、好用的内容,数据公开在 GitHub 仓库。" />
    <meta name="twitter:image" content="https://mulberrytian.vercel.app/og-default.png" />
    <!-- 防闪烁:React 挂载前同步读 localStorage 解析 theme,设到 <html data-theme>
         必须放在最顶部,且用同步 JS。React 后置设置会闪一下深色再切到亮色。
         两态:light | dark,默认 dark。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mulberry-theme-v1');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
